name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes app/api pipeline labels models retrieval markets scripts tests
      - run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: app/frontend/package-lock.json}
      - run: npm ci
        working-directory: app/frontend
      - run: npm run typecheck && npm run build
        working-directory: app/frontend
